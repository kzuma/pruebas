version: "3.9"

services:
  # Vector Database - Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

  # RAG Service
  rag_service:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    container_name: rag_service
    ports:
      - "8001:8001"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GOOGLE_CREDENTIALS_FILE=/app/credentials/google_credentials.json
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - COLLECTION_NAME=${COLLECTION_NAME:-documents}
      - CHUNK_SIZE=${CHUNK_SIZE:-512}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-64}
    volumes:
      - ./credentials:/app/credentials:ro
      - rag_models:/app/models
    depends_on:
      - qdrant
    restart: unless-stopped

  # MCP Server with OAuth 2.0
  mcp_server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: mcp_server
    ports:
      - "8000:8000"
    environment:
      - RAG_SERVICE_URL=http://rag_service:8001
      - OAUTH_SECRET_KEY=${OAUTH_SECRET_KEY}
      - OAUTH_TOKEN_EXPIRE_MINUTES=${OAUTH_TOKEN_EXPIRE_MINUTES:-60}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-rag-mcp-server}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    depends_on:
      - rag_service
    restart: unless-stopped

volumes:
  qdrant_data:
  rag_models:
